---
# Практика 12, шаги 3–5: виртуальный хост nginx из шаблонов.
# Запуск: ansible-playbook 01_nginx.yml --diff
# Повторный прогон должен дать changed=0.
#
# nginx слушает 8080, а не 80: порт 80 на web1 и web2 занят apache2,
# который поставили практики 9 и 10. Пакет nginx ставит ещё и свой
# виртуальный хост по умолчанию, а тот слушает 80, поэтому плейбук
# его убирает.

- name: "Развернуть виртуальный хост nginx на web1"
  hosts: web1
  become: true
  vars_files:
    - vars/nginx.yml
  handlers:
    - name: "Перезапустить nginx"
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enabled: true
  tasks:
    - name: "Установить nginx из репозитория ОС (Debian)"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: "Установить nginx из репозитория ОС (RedHat)"
      ansible.builtin.dnf:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: "Убрать виртуальный хост по умолчанию (Debian)"
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      when: ansible_facts['os_family'] == "Debian"
      notify: Перезапустить nginx

    - name: "Убрать виртуальный хост по умолчанию (RedHat)"
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      when: ansible_facts['os_family'] == "RedHat"
      notify: Перезапустить nginx

    # Проверка ДО раскладки наших файлов: если конфигурация сломана
    # до плейбука, узнать об этом надо сейчас, а не после того, как
    # в conf.d появились наши файлы. Отдельной задачей — по той же
    # причине, что и в конце: validate для этого не годится.
    - name: "Проверить конфигурацию nginx до раскладки наших файлов"
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      register: nginx_before

    - name: "Убедиться, что конфигурация исправна до наших правок"
      ansible.builtin.assert:
        that:
          - nginx_before.rc == 0
        fail_msg: >-
          nginx -t не прошёл до наших правок: rc={{ nginx_before.rc }},
          {{ nginx_before.stderr | default('') | trim }}.
          Сначала почините конфигурацию, потом запускайте этот плейбук.
        success_msg: "Конфигурация nginx исправна до наших правок."

    # Порт 8080 открывается отдельной задачей: на web1 включён ufw
    # с политикой deny, и без правила curl с управляющей машины
    # до nginx не дойдёт. Правило открывает порт из переменной
    # nginx_port, поэтому порт в плейбуке не зашит.
    - name: "Открыть порт nginx в межсетевом экране"
      community.general.ufw:
        rule: allow
        port: "{{ nginx_port }}"
        proto: tcp

    - name: "Создать каталог сайта"
      ansible.builtin.file:
        path: "{{ nginx_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Положить страницу-заглушку в корень сайта"
      ansible.builtin.copy:
        content: "<h1>{{ inventory_hostname }}</h1>\n<p>Страница практики 12.</p>\n"
        dest: "{{ nginx_root }}/{{ nginx_index }}"
        owner: root
        group: root
        mode: "0644"

    - name: "Развернуть upstream из шаблона nginx_upstream.j2"
      ansible.builtin.template:
        src: nginx_upstream.j2
        dest: "/etc/nginx/conf.d/{{ nginx_upstream_name }}.conf"
        owner: root
        group: root
        mode: "0644"
        trim_blocks: true
        lstrip_blocks: true
        backup: true
      notify: Перезапустить nginx

    - name: "Развернуть виртуальный хост из шаблона nginx_vhost.j2"
      ansible.builtin.template:
        src: nginx_vhost.j2
        dest: "/etc/nginx/conf.d/{{ nginx_server_name }}.conf"
        owner: root
        group: root
        mode: "0644"
        trim_blocks: true
        lstrip_blocks: true
        backup: true
      notify: Перезапустить nginx

    # validate здесь не подходит: у модулей copy и template в команде
    # обязателен %s (иначе задача падает с «validate must contain %s»),
    # а подставить его для nginx нечем: nginx проверяет конфигурацию
    # целиком, и на временном файле-фрагменте из conf.d проверка падает
    # («server directive is not allowed here»). Поэтому файлы сначала
    # кладутся на место, а затем проверяется вся конфигурация — вместе
    # с нашим фрагментом.
    - name: "Проверить конфигурацию nginx целиком"
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      failed_when: false
      register: nginx_check

    # Если проверка не прошла, файлы, добавленные этим плейбуком,
    # убираются, конфигурация проверяется ещё раз (она должна снова
    # проходить) и только после этого прогон останавливается. Перезапуск
    # не нужен: обработчик не вызывался, служба работает на прежней
    # конфигурации.
    - name: "Проверка не прошла: убрать наши файлы и проверить снова"
      when: nginx_check.rc != 0
      block:
        - name: "Убрать файлы, которые добавил плейбук"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/etc/nginx/conf.d/{{ nginx_upstream_name }}.conf"
            - "/etc/nginx/conf.d/{{ nginx_server_name }}.conf"

        - name: "Проверить конфигурацию после отката"
          ansible.builtin.command:
            cmd: nginx -t
          changed_when: false
          failed_when: false
          register: nginx_check_after

        - name: "Остановить прогон: конфигурация была сломана"
          ansible.builtin.fail:
            msg: >-
              nginx -t не прошёл: {{ nginx_check.stderr | default('') | trim }}.
              Файлы, добавленные плейбуком, убраны; проверка после отката
              вернула rc={{ nginx_check_after.rc }}.
