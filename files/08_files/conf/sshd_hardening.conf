# sshd_hardening.conf — образец фрагмента конфигурации sshd
# для практики 8.
#
# Это содержимое файла, который плейбук 03_lineinfile.yml создаёт
# на узле как /etc/ssh/sshd_config.d/20-sshd-hardening.conf.
# Сам плейбук пишет только две строки настроек; здесь к ним
# добавлены комментарии — так выглядит файл после того, как его
# один раз посмотрели глазами и объяснили коллеге.
#
# Почему отдельный файл, а не правка /etc/ssh/sshd_config:
# основной файл принадлежит пакету openssh-server и может быть
# заменён при обновлении. Файлы каталога sshd_config.d/ читаются
# как продолжение основного (строка Include) и принадлежат нам.
#
# Почему имя начинается на 20: sshd берёт ПЕРВОЕ найденное значение
# параметра, а файлы каталога подставляет по алфавиту — Include
# разворачивает sshd_config.d/*.conf в лексикографическом порядке.
# На Ubuntu уже лежит 50-cloud-init.conf; имя 20-... идёт раньше,
# поэтому наши значения побеждают. Имя 55-... читалось бы позже,
# и cloud-init перекрыл бы нас.
# Рядом лежит 10-lab-nopassword.conf из практики 2: префикс 10
# относится к ней, префикс 20 — к этой практике.
#
# Проверка после правки выполняется на узле:
#   sshd -t          — синтаксис конфигурации
#   sshd -T          — действующие значения параметров
# В плейбуке та же проверка стоит параметром validate: sshd -t -f %s
# и выполняется до того, как файл займёт своё место.

# Запретить вход root по SSH полностью.
# Учебный стенд использует пользователя engineer с правами sudo,
# поэтому root для входа не нужен.
PermitRootLogin no

# Запретить вход по паролю: остаётся только вход по ключу.
# В практике 1 настроен ключ ed25519, поэтому эта строка
# не отнимает доступ, а закрывает перебор паролей.
PasswordAuthentication no

# Публикация отпечатков ключей узла: без неё клиент при первом
# подключении видит вопрос о доверии к отпечатку.
# В стенде с отключённым host_key_checking это удобно, в рабочей
# среде так не делают: отпечатки должны проверяться.
HostKeyAlgorithms ssh-ed25519
