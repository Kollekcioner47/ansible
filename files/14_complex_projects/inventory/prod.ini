# inventory/prod.ini — окружение prod. Формат INI.
# Адреса те же, что в dev: на стенде машин всего три, и различие
# окружений задано не машинами, а переменными playbooks/group_vars/prod.yml.
# В рабочем проекте у prod был бы свой парк машин.

[web]
web1 ansible_host=10.0.2.11
web2 ansible_host=10.0.2.12

[db]
db1 ansible_host=10.0.2.13

[linux:children]
web
db

[prod:children]
linux
