# ansible.cfg — настройки учебного проекта практики 15.
#
# Файл лежит в каталоге проекта, поэтому Ansible читает его сам:
# ansible.cfg в текущем каталоге сильнее ~/.ansible.cfg и
# /etc/ansible/ansible.cfg. Порядок разобран в практике 2.
#
# Секция называется [defaults]. Секция [default] молча игнорируется.

[defaults]
inventory = ./inventory.ini
host_key_checking = False
remote_user = engineer
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
forks = 10

# Где Ansible ищет роли: каталоги перечислены через двоеточие и
# читаются слева направо. Значение из ansible.cfg ЗАМЕНЯЕТ список
# по умолчанию (~/.ansible/roles:/usr/share/ansible/roles:
# /etc/ansible/roles), а не дополняет его, поэтому здесь перечислено
# всё, что нужно: свои роли, роли из Galaxy и роли из пакетов ОС.
#
# Первый каталог списка — ещё и место установки: роль, поставленная
# командой ansible-galaxy role install, ляжет в ./galaxy_roles.
roles_path = ./galaxy_roles:./roles:/usr/share/ansible/roles

# Где Ansible ищет коллекции. К указанному каталогу ansible-galaxy
# дописывает ansible_collections, поэтому установка пойдёт в
# ./collections/ansible_collections. Такой же каталог рядом с
# плейбуком Ansible находит и без этой настройки.
collections_path = ./collections:/usr/share/ansible/collections
