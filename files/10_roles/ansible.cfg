# ansible.cfg — настройки Ansible для учебного проекта практики 10.
# Тот же файл, что в практике 2, и по той же причине: секция
# называется [defaults], а инвентарь берётся из каталога проекта,
# поэтому команды выполняются из каталога 10_roles.

[defaults]
inventory = ./inventory.ini
host_key_checking = False
remote_user = engineer
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
forks = 10
