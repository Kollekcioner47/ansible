---
# group_vars/web.yml — переменные только для машин группы web
# (web1 и web2). Здесь переопределяются значения по умолчанию
# роли web_admin: ровно для этого defaults и существуют.

# На машинах группы web страница сайта разворачивается.
# У роли по умолчанию false: на db1 сайта нет, там только httpd.
web_admin_deploy_site: true

# Заголовок страницы: у группы он свой, у роли — свой по умолчанию.
web_admin_site_title: "Веб-узел учебного стенда Ansible"

# Владелец машины: значение берётся из group_vars/all.yml.
web_admin_owner: "{{ lab_owner }}"
