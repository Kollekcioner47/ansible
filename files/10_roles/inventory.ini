# Инвентарь учебного проекта практики 10. Формат INI.
#
# Группы по назначению (web, db) и группы по семейству ОС
# (debian, redhat) — разные вещи. Группа linux собирает
# все управляемые узлы стенда.

[web]
web1 ansible_host=10.0.2.11
web2 ansible_host=10.0.2.12

[db]
db1 ansible_host=10.0.2.13

[linux:children]
web
db

[debian:children]
web

[redhat:children]
db
